data_sources:
  source_a:
    source_id: "SRC_PRDECT_ID_V1"
    dataset_name: "Product Reviews Dataset for Emotions Classification Tasks - Indonesian (PRDECT-ID)"
    role: "PRIMARY_RESEARCH_ANNOTATED_DATASET"
    publisher: "Mendeley Data"
    doi: "10.17632/574v66hf2v.1"
    version: "1"
    declared_license: "CC BY 4.0"
    license_evidence_type: "CANONICAL_MENDELEY_RECORD"
    project_raw_distribution_policy: "LOCAL_ONLY"
    local_path: "data/raw/prdect_id/PRDECT-ID Dataset.csv"
    expected_file: "PRDECT-ID Dataset.csv"
    official_columns:
      - Category
      - Product Name
      - Location
      - Price
      - Overall Rating
      - Number Sold
      - Total Review
      - Customer Rating
      - Customer Review
      - Sentiment
      - Emotion
    provided_annotated_labels:
      sentiment: "Provided 2-class sentiment label (Positive/Negative)"
      emotion: "Provided 5-class emotion label (Happy, Sadness, Fear, Love, Anger)"

  source_b:
    source_id: "SRC_TOKOPEDIA_REVIEWS_2019"
    dataset_name: "Tokopedia Product Reviews 2019"
    role: "SECONDARY_BI_SCALE_DATASET"
    publisher: "Hugging Face (farhamu)"
    canonical_reference: "https://huggingface.co/datasets/farhamu/tokopedia-product-reviews-2019"
    declared_license: "Apache-2.0"
    license_evidence_type: "HUGGINGFACE_DATASET_CARD"
    license_confidence: "DECLARED_BY_REPOSITORY_MAINTAINER"
    project_raw_distribution_policy: "LOCAL_ONLY"
    local_path: "data/raw/tokopedia_product_reviews_2019/tokopedia-product-reviews-2019.csv"
    expected_file: "tokopedia-product-reviews-2019.csv"
    official_columns:
      - text
      - rating
      - category
      - product_name
      - product_id
      - sold
      - shop_id
      - product_url
    product_url_public_analytics: "DISABLED"

  cross_source_rules:
    cross_source_product_linkage: false
    cross_source_shop_linkage: false
    cross_source_row_linkage: false
